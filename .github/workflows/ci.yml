name: Storefront checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check src/app.js
          node --check src/catalog.js
          node --check src/filters.js
      - name: Run tests
        run: npm test
