name: Gridborn controller-media private full QA
on:
  push:
    branches: [feature/foundry-controller-v1]
  pull_request:
    paths:
      - 'assets/demos/**'
      - 'assets/studies/cave-goblin.svg'
      - 'assets/studies/skeleton-warrior.svg'
      - 'assets/studies/giant-cave-spider.svg'
      - 'assets/studies/animated-armor.svg'
      - 'assets/studies/orc-axe-vanguard-pregen.svg'
      - 'assets/studies/elven-wizard.svg'
      - 'assets/studies/dwarven-cleric.svg'
      - 'assets/studies/human-mercywarden-female.svg'
      - 'assets/studies/human-shadowstep-nonbinary.svg'
      - 'assets/studies/cave-ogre.svg'
      - 'assets/studies/gnome-rogue.svg'
      - 'assets/studies/elven-ranger.svg'
      - 'assets/studies/halfling-bard.svg'
      - 'assets/studies/human-wildspeaker-druid.svg'
      - 'assets/studies/human-wayfarer-monk.svg'
      - 'assets/studies/elf-sparkweaver-sorcerer.svg'
      - 'assets/studies/dwarf-hexwarden-warlock.svg'
      - 'assets/studies/orc-stonefist-female.svg'
      - 'assets/studies/goblin-stonefist-nonbinary.svg'
      - 'assets/studies/orc-pathfinder-female.svg'
      - 'assets/studies/goblin-pathfinder-nonbinary.svg'
      - 'assets/studies/dwarf-pathfinder-male.svg'
      - 'assets/studies/orc-songweaver-female.svg'
      - 'assets/studies/swamp-lizardfolk.svg'
      - 'assets/studies/human-paladin.svg'
      - 'assets/studies/great-white-shark.svg'
      - 'src/creature-rigs/**'
      - 'tools/export_demo.py'
      - 'tools/export_states.py'
      - 'tools/state_only_spec.py'
      - 'tools/media_cert.py'
      - 'tools/controller_package.py'
      - 'tools/asset_spec.py'
      - '.github/workflows/foundry-media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-private-controller-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - manifest: assets/demos/manifest.json
            id: chr-ftr-human
            exporter: tools/export_demo.py
          - manifest: assets/demos/cave-goblin-manifest.json
            id: mon-cave-goblin
            exporter: tools/export_demo.py
          - manifest: assets/demos/gray-wolf-manifest.json
            id: ani-forest-wolf
            exporter: tools/export_states.py
          - manifest: assets/demos/skeleton-warrior-manifest.json
            id: mon-dng-skeleton
            exporter: tools/export_states.py
          - manifest: assets/demos/giant-cave-spider-manifest.json
            id: mon-cave-spider
            exporter: tools/export_states.py
          - manifest: assets/demos/elven-wizard-manifest.json
            id: chr-wiz-elf
            exporter: tools/export_states.py
          - manifest: assets/demos/orc-axe-vanguard-pregen-manifest.json
            id: pregen-barbarian-male-3
            exporter: tools/export_states.py
          - manifest: assets/demos/animated-armor-manifest.json
            id: mon-dng-armor
            exporter: tools/export_states.py
          - manifest: assets/demos/dwarven-cleric-manifest.json
            id: chr-clr-dwarf
            exporter: tools/export_states.py
          - manifest: assets/demos/human-mercywarden-female-manifest.json
            id: pregen-cleric-female-2
            exporter: tools/export_states.py
          - manifest: assets/demos/human-shadowstep-nonbinary-manifest.json
            id: pregen-rogue-nonbinary-1
            exporter: tools/export_states.py
          - manifest: assets/demos/cave-ogre-manifest.json
            id: mon-cave-ogre
            exporter: tools/export_states.py
          - manifest: assets/demos/human-paladin-manifest.json
            id: chr-pal-human
            exporter: tools/export_states.py
          - manifest: assets/demos/gnome-rogue-manifest.json
            id: chr-rge-gnome
            exporter: tools/export_states.py
          - manifest: assets/demos/elven-ranger-manifest.json
            id: chr-rng-elf
            exporter: tools/export_states.py
          - manifest: assets/demos/halfling-bard-manifest.json
            id: chr-brd-halfling
            exporter: tools/export_states.py
          - manifest: assets/demos/human-wildspeaker-druid-manifest.json
            id: pregen-druid-female-1
            exporter: tools/export_states.py
          - manifest: assets/demos/human-wayfarer-monk-manifest.json
            id: pregen-monk-male-1
            exporter: tools/export_states.py
          - manifest: assets/demos/elf-sparkweaver-sorcerer-manifest.json
            id: pregen-sorcerer-nonbinary-1
            exporter: tools/export_states.py
          - manifest: assets/demos/dwarf-hexwarden-warlock-manifest.json
            id: pregen-warlock-nonbinary-1
            exporter: tools/export_states.py
          - manifest: assets/demos/orc-stonefist-female-manifest.json
            id: pregen-monk-female-3
            exporter: tools/export_states.py
          - manifest: assets/demos/goblin-stonefist-nonbinary-manifest.json
            id: pregen-monk-nonbinary-3
            exporter: tools/export_states.py
          - manifest: assets/demos/orc-pathfinder-female-manifest.json
            id: pregen-ranger-female-1
            exporter: tools/export_states.py
          - manifest: assets/demos/goblin-pathfinder-nonbinary-manifest.json
            id: pregen-ranger-nonbinary-1
            exporter: tools/export_states.py
          - manifest: assets/demos/dwarf-pathfinder-male-manifest.json
            id: pregen-ranger-male-1
            exporter: tools/export_states.py
          - manifest: assets/demos/orc-songweaver-female-manifest.json
            id: pregen-bard-female-1
            exporter: tools/export_states.py
          - manifest: assets/demos/swamp-lizardfolk-manifest.json
            id: mon-swamp-lizard
            exporter: tools/export_states.py
          - manifest: assets/demos/great-white-shark-manifest.json
            id: ani-ocean-greatwhite
            exporter: tools/export_states.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render and image dependencies
        run: |
          python -m pip install 'playwright==1.57.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          command -v ffprobe
      - name: Generate private controller files and verify decoded alpha
        run: |
          python "${{ matrix.exporter }}" --certify --controller-package \
            --manifest "${{ matrix.manifest }}" \
            --output-dir "$RUNNER_TEMP/gridborn-private"
      - name: Check four individual clips and no commercial claims
        env:
          TOKEN_ID: ${{ matrix.id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP']) / 'gridborn-private'
          folder = base / (os.environ['TOKEN_ID'] + '-foundry')
          data = json.loads((folder / 'gridborn-preview.json').read_text())
          assert data['purchaseEnabled'] is False
          assert data['vttCompatibility'] == 'untested'
          token = os.environ['TOKEN_ID']
          durations_by_id = {
              'mon-cave-goblin': [('idle', 3.6), ('move', 3.6), ('attack', 1.4), ('rest', 6)],
              'chr-ftr-human': [('idle', 3.2), ('move', 3.2), ('attack', 1.4), ('rest', 6)],
              'ani-forest-wolf': [('idle', 3.2), ('move', 2), ('attack', 1.3), ('rest', 4.8)],
              'mon-dng-skeleton': [('idle', 3), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'mon-cave-spider': [('idle', 3.6), ('move', 2.4), ('attack', 1.4), ('rest', 5)],
              'chr-wiz-elf': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-barbarian-male-3': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'mon-dng-armor': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'chr-clr-dwarf': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-cleric-female-2': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-rogue-nonbinary-1': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'mon-cave-ogre': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'chr-pal-human': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'chr-rge-gnome': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'chr-rng-elf': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'chr-brd-halfling': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-druid-female-1': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-monk-male-1': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-sorcerer-nonbinary-1': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-warlock-nonbinary-1': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-monk-female-3': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-monk-nonbinary-3': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-ranger-female-1': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-ranger-nonbinary-1': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-ranger-male-1': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'pregen-bard-female-1': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'mon-swamp-lizard': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'ani-ocean-greatwhite': [('idle', 3.2), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
          }
          stem_by_id = {
              'mon-cave-goblin': 'cave-goblin',
              'chr-ftr-human': 'human-fighter',
              'ani-forest-wolf': 'gray-wolf',
              'mon-dng-skeleton': 'skeleton-warrior',
              'mon-cave-spider': 'giant-cave-spider',
              'chr-wiz-elf': 'elven-wizard',
              'pregen-barbarian-male-3': 'orc-axe-vanguard-pregen',
              'mon-dng-armor': 'animated-armor',
              'chr-clr-dwarf': 'dwarven-cleric',
              'pregen-cleric-female-2': 'human-mercywarden-female',
              'pregen-rogue-nonbinary-1': 'human-shadowstep-nonbinary',
              'mon-cave-ogre': 'cave-ogre',
              'chr-pal-human': 'human-paladin',
              'chr-rge-gnome': 'gnome-rogue',
              'chr-rng-elf': 'elven-ranger',
              'chr-brd-halfling': 'halfling-bard',
              'pregen-druid-female-1': 'human-wildspeaker-druid',
              'pregen-monk-male-1': 'human-wayfarer-monk',
              'pregen-sorcerer-nonbinary-1': 'elf-sparkweaver-sorcerer',
              'pregen-warlock-nonbinary-1': 'dwarf-hexwarden-warlock',
              'pregen-monk-female-3': 'orc-stonefist-female',
              'pregen-monk-nonbinary-3': 'goblin-stonefist-nonbinary',
              'pregen-ranger-female-1': 'orc-pathfinder-female',
              'pregen-ranger-nonbinary-1': 'goblin-pathfinder-nonbinary',
              'pregen-ranger-male-1': 'dwarf-pathfinder-male',
              'pregen-bard-female-1': 'orc-songweaver-female',
              'mon-swamp-lizard': 'swamp-lizardfolk',
              'ani-ocean-greatwhite': 'great-white-shark',
          }
          durations = durations_by_id[token]
          assert data['attackMs'] == (1300 if token == 'ani-forest-wolf' else 1400)
          assert data['clipSource'] == 'independent-svg-states'
          assert data['stateOnly'] == (token not in ('chr-ftr-human', 'mon-cave-goblin'))
          assert set(data['sourceFiles']) == {'idle', 'move', 'attack'}
          if data['stateOnly']:
              assert data['restSourceFile'] == 'assets/demos/' + stem_by_id[token] + '-rest.svg'
          stem = stem_by_id[token]
          for label in ('idle', 'move', 'attack'):
              assert data['sourceFiles'][label] == 'assets/demos/' + stem + '-' + label + '.svg'
              assert data['independentMotionQA'][label]['distinctSampleFrames'] >= 2
          for name in ['idle.webm', 'move.webm', 'attack.webm', 'rest.webm', 'still.png']:
              assert (folder / name).stat().st_size > 0
          for label, seconds in durations:
              assert data['technicalQA'][label]['frames'] == round(seconds * 10)
              assert data['technicalQA'][label]['decodedAlphaVerified']
          print('Private state-exact Foundry media passed; no artwork published')
          PY
