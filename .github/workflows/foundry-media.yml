name: Gridborn controller-media private full QA
on:
  push:
    branches: [feature/foundry-controller-v1]
  pull_request:
    paths:
      - 'assets/demos/**'
      - 'assets/studies/cave-goblin.svg'
      - 'assets/studies/skeleton-warrior.svg'
      - 'assets/studies/giant-cave-spider.svg'
      - 'src/creature-rigs/**'
      - 'tools/export_demo.py'
      - 'tools/export_states.py'
      - 'tools/state_only_spec.py'
      - 'tools/media_cert.py'
      - 'tools/controller_package.py'
      - 'tools/asset_spec.py'
      - '.github/workflows/foundry-media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-private-controller-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - manifest: assets/demos/manifest.json
            id: chr-ftr-human
            exporter: tools/export_demo.py
          - manifest: assets/demos/cave-goblin-manifest.json
            id: mon-cave-goblin
            exporter: tools/export_demo.py
          - manifest: assets/demos/gray-wolf-manifest.json
            id: ani-forest-wolf
            exporter: tools/export_states.py
          - manifest: assets/demos/skeleton-warrior-manifest.json
            id: mon-dng-skeleton
            exporter: tools/export_states.py
          - manifest: assets/demos/giant-cave-spider-manifest.json
            id: mon-cave-spider
            exporter: tools/export_states.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render and image dependencies
        run: |
          python -m pip install 'playwright==1.57.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          command -v ffprobe
      - name: Generate private controller files and verify decoded alpha
        run: |
          python "${{ matrix.exporter }}" --certify --controller-package \
            --manifest "${{ matrix.manifest }}" \
            --output-dir "$RUNNER_TEMP/gridborn-private"
      - name: Check four individual clips and no commercial claims
        env:
          TOKEN_ID: ${{ matrix.id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP']) / 'gridborn-private'
          folder = base / (os.environ['TOKEN_ID'] + '-foundry')
          data = json.loads((folder / 'gridborn-preview.json').read_text())
          assert data['purchaseEnabled'] is False
          assert data['vttCompatibility'] == 'untested'
          token = os.environ['TOKEN_ID']
          durations_by_id = {
              'mon-cave-goblin': [('idle', 3.6), ('move', 3.6), ('attack', 1.4), ('rest', 6)],
              'chr-ftr-human': [('idle', 3.2), ('move', 3.2), ('attack', 1.4), ('rest', 6)],
              'ani-forest-wolf': [('idle', 3.2), ('move', 2), ('attack', 1.3), ('rest', 4.8)],
              'mon-dng-skeleton': [('idle', 3), ('move', 2.4), ('attack', 1.4), ('rest', 4)],
              'mon-cave-spider': [('idle', 3.6), ('move', 2.4), ('attack', 1.4), ('rest', 5)],
          }
          stem_by_id = {
              'mon-cave-goblin': 'cave-goblin',
              'chr-ftr-human': 'human-fighter',
              'ani-forest-wolf': 'gray-wolf',
              'mon-dng-skeleton': 'skeleton-warrior',
              'mon-cave-spider': 'giant-cave-spider',
          }
          durations = durations_by_id[token]
          assert data['attackMs'] == (1300 if token == 'ani-forest-wolf' else 1400)
          assert data['clipSource'] == 'independent-svg-states'
          assert data['stateOnly'] == (token in ('ani-forest-wolf', 'mon-dng-skeleton', 'mon-cave-spider'))
          assert set(data['sourceFiles']) == {'idle', 'move', 'attack'}
          if token in ('ani-forest-wolf','mon-dng-skeleton','mon-cave-spider'):
              assert data['restSourceFile'] == 'assets/demos/' + stem_by_id[token] + '-rest.svg'
          stem = stem_by_id[token]
          for label in ('idle', 'move', 'attack'):
              assert data['sourceFiles'][label] == 'assets/demos/' + stem + '-' + label + '.svg'
              assert data['independentMotionQA'][label]['distinctSampleFrames'] >= 2
          for name in ['idle.webm', 'move.webm', 'attack.webm', 'rest.webm', 'still.png']:
              assert (folder / name).stat().st_size > 0
          for label, seconds in durations:
              assert data['technicalQA'][label]['frames'] == round(seconds * 10)
              assert data['technicalQA'][label]['decodedAlphaVerified']
          print('Private state-exact Foundry media passed; no artwork published')
          PY
