name: Full Fighter media technical QA
on:
  push:
    branches: [feature/full-media-certification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-technical-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering and image validation dependencies
        run: |
          python -m pip install 'playwright==1.57.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium
      - name: Verify FFmpeg tools
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          command -v ffprobe
      - name: Validate manifest and media-logic regressions
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Render and certify ALL 450 action and 60 rest frames
        run: python tools/export_demo.py --certify --output-dir "$RUNNER_TEMP/gridborn-full-qa"
      - name: Confirm manifest stays noncommercial
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'gridborn-full-qa' /
                               'chr-ftr-human-media-qa.json').read_text())
          assert report['status'] == 'technical-preview-pass'
          assert report['purchasable'] is False
          assert report['vttCompatibility'] == 'untested'
          assert report['actionVideo']['frames'] == 450
          assert report['restVideo']['frames'] == 60
          assert report['actionVideo']['decodedAlphaVerified']
          assert report['restVideo']['decodedAlphaVerified']
          print('Full export QA verified; files retained only on ephemeral runner.')
          PY
