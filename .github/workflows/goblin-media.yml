name: Goblin full-duration alpha export QA
on:
  push:
    branches: [feature/second-animated-goblin]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  goblin-technical-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Pillow
        run: |
          python -m pip install 'playwright==1.57.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium
      - name: Verify FFmpeg and source contract
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          command -v ffprobe
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Render full Cave Goblin action and rest prototypes
        run: |
          python tools/export_demo.py --certify \
            --manifest assets/demos/cave-goblin-manifest.json \
            --output-dir "$RUNNER_TEMP/goblin-art-qa"
      - name: Verify QA without publishing private media
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'goblin-art-qa' /
              'mon-cave-goblin-media-qa.json').read_text(encoding='utf-8'))
          assert data['asset'] == 'mon-cave-goblin'
          assert data['purchasable'] is False
          assert data['vttCompatibility'] == 'untested'
          assert data['actionVideo']['frames'] == 450
          assert data['restVideo']['frames'] == 60
          assert data['actionVideo']['decodedAlphaVerified']
          assert data['restVideo']['decodedAlphaVerified']
          print('Goblin technical alpha media QA passed; no artifacts published')
          PY
