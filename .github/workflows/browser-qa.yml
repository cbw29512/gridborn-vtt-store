name: Chromium storefront UI QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright/Chromium
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Check browser QA source syntax
        run: python -m py_compile tools/browser_smoke.py
      - name: Run 1440, 390 and 320 pixel Chromium checks
        run: python tools/browser_smoke.py
