<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description">
<title id="title">Gridborn Fighter — repeating Idle, Move, Attack and Recovery animation</title>
<desc id="description">An automatically repeating 9-second combat preview cycling through Idle, Move, Attack and Recovery; original concept artwork, not a certified product.</desc>
<style>
 .body{animation:gridborn-full-body 9s steps(2,end) infinite}
 .cape{animation:gridborn-full-cape 9s steps(2,end) infinite}
 .sword{transform-origin:164px 127px;animation:gridborn-full-weapon 9s ease-in-out infinite}
 .eye{animation:gridborn-full-blink 9s steps(1,end) infinite}
 @keyframes gridborn-full-body{
  0%,15%,100%{transform:translate(0,0)}
  21%{transform:translate(-9px,-4px)}
  28%{transform:translate(7px,-1px)}
  35%{transform:translate(-10px,-5px)}
  42%{transform:translate(9px,0)}
  49%{transform:translate(-7px,-5px)}
  56%{transform:translate(0,0)}
  63%{transform:translate(7px,3px)}
  69%{transform:translate(-12px,-8px)}
  76%{transform:translate(-5px,-4px)}
  85%{transform:translate(2px,-1px)}
 }
 @keyframes gridborn-full-cape{
  0%,15%,100%{transform:translateX(0)}
  21%,35%,49%{transform:translateX(6px)}
  28%,42%,56%{transform:translateX(-7px)}
  63%{transform:translateX(-9px)}
  69%{transform:translateX(12px)}
  85%{transform:translateX(3px)}
 }
 @keyframes gridborn-full-weapon{
  0%,54%,100%{transform:rotate(0)}
  60%{transform:rotate(-55deg)}
  68%{transform:rotate(75deg)}
  75%{transform:rotate(20deg)}
  87%{transform:rotate(0)}
 }
 @keyframes gridborn-full-blink{
  0%,11%,13%,97%,100%{opacity:1}
  12%,98%{opacity:0}
 }
 @media(prefers-reduced-motion:reduce){.body,.cape,.sword,.eye{animation:none!important}}
</style>
<ellipse cx="129" cy="194" rx="53" ry="13" fill="#080f1c" opacity=".32"/>
<ellipse cx="128" cy="192" rx="67" ry="22" fill="none" stroke="#e9b967" stroke-width="3" opacity=".72"/>

