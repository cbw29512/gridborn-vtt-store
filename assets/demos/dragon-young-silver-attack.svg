<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges" data-gridborn-mode="attack" data-foundation-id="western-four-legged-winged-dragon" data-dragon-species="Silver" data-dragon-age="young">
<title id="title">Young Silver Dragon — original Gridborn attack art study</title>
<desc id="description">Original side-profile six-limbed fantasy dragon, four articulated legs, two membranous wings, tail, horns, readable eye and species-specific cold breath. Research and release approval pending.</desc>
<style>#dragon-head{transform-origin:180px 122px;animation:dragon-exhale 1.4s steps(1,end) 1 both}#dragon-mouth{transform-origin:204px 125px;animation:dragon-open-jaws 1.4s steps(1,end) 1 both}#dragon-breath{animation:dragon-release 1.4s steps(1,end) 1 both}#dragon-wing-near{transform-origin:120px 106px;animation:dragon-wing-brace 1.4s steps(1,end) 1 both}
@keyframes dragon-exhale{0%,100%{transform:rotate(0)}23%{transform:rotate(-6deg)}52%,65%{transform:rotate(5deg)}}
@keyframes dragon-open-jaws{0%,100%{transform:rotate(0)}34%,68%{transform:rotate(10deg)}}
@keyframes dragon-wing-brace{0%,100%{transform:rotate(0)}35%,67%{transform:rotate(-11deg)}}
@keyframes dragon-release{0%,38%,79%,100%{opacity:0;transform:translate(0,0) scale(.5)}49%,62%{opacity:1;transform:translate(9px,-2px) scale(1)}}
@media(prefers-reduced-motion:reduce){#dragon-core,#dragon-tail,#dragon-wing-near,#dragon-head,#dragon-mouth,#dragon-breath,#dragon-front-near,#dragon-hind-near,#dragon-front-far,#dragon-hind-far{animation:none!important}#dragon-breath{opacity:0!important}}</style>
