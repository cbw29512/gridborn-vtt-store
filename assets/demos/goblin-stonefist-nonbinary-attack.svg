<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="attack" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Goblin Stonefist Monk — original Gridborn sweep fighter — attack study</title>
<desc id="description">Original nonbinary goblin martial artist: compact green short-limbed anatomy, prominent paired pointed ears, small nose, orange shoulder wrap with zigzag woven trim, irregular dark indigo tunic, webbed cloth fist bindings and a low lateral heel-sweep unarmed attack that replaces the complete hip-to-toe leg. No weapons and no generic humanoid rig. Noncommercial animation study.</desc>
<style>
.gob-core{animation:gob-sweep-brace 1.4s steps(1,end) 1 both}.gob-right-guard{animation:gob-sweep-guard-hide 1.4s steps(1,end) 1 both}.gob-feint-arm{animation:gob-elbow-feint 1.4s steps(1,end) 1 both}.gob-right-leg{animation:gob-sweep-leg-hide 1.4s steps(1,end) 1 both}.gob-heel-sweep{transform-origin:145px 173px;animation:gob-low-heel-kick 1.4s steps(1,end) 1 both}.gob-sweep-dust{animation:gob-ground-scuff 1.4s steps(1,end) 1 both}
@keyframes gob-sweep-brace{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,-3px)}46%{transform:translate(-1px,4px)}66%{transform:translate(2px,1px)}84%{transform:translate(0,0)}}
@keyframes gob-sweep-guard-hide{0%,19%,46%,100%{opacity:1}23%,42%{opacity:0}}
@keyframes gob-elbow-feint{0%,19%,46%,100%{opacity:0}23%,42%{opacity:1}}
@keyframes gob-sweep-leg-hide{0%,48%,78%,100%{opacity:1}53%,72%{opacity:0}}
@keyframes gob-low-heel-kick{0%,48%,78%,100%{opacity:0;transform:translate(-24px,6px) rotate(-18deg)}53%{opacity:1;transform:translate(-22px,5px) rotate(-14deg)}59%,67%{opacity:1;transform:translate(0,0) rotate(0)}72%{opacity:1;transform:translate(-16px,5px) rotate(-11deg)}}
@keyframes gob-ground-scuff{0%,54%,77%,100%{opacity:0;transform:translateY(0)}61%,68%{opacity:1;transform:translateY(-2px)}73%{opacity:.4;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.gob-core,.gob-left-guard,.gob-right-guard,.gob-left-leg,.gob-right-leg,.gob-feint-arm,.gob-heel-sweep,.gob-sweep-dust{animation:none!important}}
</style>
