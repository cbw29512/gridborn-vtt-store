<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges" data-gridborn-mode="idle">
<title id="title">Cave Goblin — looping idle breathing and blink study</title>
<desc id="description">Independent idle animation preview. Original Cave Goblin study only; not an exported or purchasable VTT token.</desc>
<ellipse cx="128" cy="200" rx="58" ry="13" fill="#060b16" opacity=".34"/>
<ellipse cx="128" cy="195" rx="70" ry="24" fill="none" stroke="#ddb268" stroke-width="3" opacity=".70"/>

<style>

.body{animation:gb-goblin-idle 3.6s ease-in-out infinite;transform-origin:128px 150px}
.blade{animation:gb-goblin-idle-blade 3.6s ease-in-out infinite;transform-origin:183px 134px}
.buckler{animation:gb-goblin-idle-buckler 3.6s ease-in-out infinite;transform-origin:87px 146px}
.goblin-blink{animation:gb-goblin-blink 5.9s steps(1,end) infinite;opacity:0}
@keyframes gb-goblin-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes gb-goblin-idle-blade{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
@keyframes gb-goblin-idle-buckler{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
@keyframes gb-goblin-blink{0%,47%,50%,100%{opacity:0}48%,49%{opacity:1}}
@media(prefers-reduced-motion:reduce){.body,.blade,.buckler,.goblin-leg-left,.goblin-leg-right,.goblin-blink{animation:none!important}}
</style>
<g class="body">
<!-- shadows and pointed legs -->
<path d="M110 142h43v49h-14l-7-24-9 24h-18z" fill="#27262d"/>
<g class="goblin-leg-left"><path d="M107 164h15v23h-15z" fill="#806446"/></g><g class="goblin-leg-right"><path d="M136 164h17v23h-17z" fill="#806446"/></g>
<!-- little cape and jerkin -->
<path d="M104 91h49l21 44-19 29h-49l-19-27z" fill="#232a2b"/>
<path d="M106 100h45l14 41-17 18h-35l-18-18z" fill="#965b36"/>
<path d="M112 103h33v39h-33z" fill="#48644f"/>
<rect x="112" y="143" width="38" height="8" fill="#c0a06f"/><rect x="125" y="143" width="9" height="11" fill="#e3c484"/>
<!-- face and giant ears -->
<path d="M107 60h49v53h-49z" fill="#172a2b"/>
<path d="M109 65h44v46h-44z" fill="#72966a"/>
<path d="M112 74L83 61l10 34 21 8zM151 74l29-13-10 34-20 8z" fill="#608a5e"/>
<rect x="115" y="82" width="13" height="10" fill="#342d2b"/><rect x="138" y="82" width="13" height="10" fill="#342d2b"/>
<rect x="118" y="83" width="7" height="6" fill="#f8c75e"/><rect x="141" y="83" width="7" height="6" fill="#f8c75e"/><g class="goblin-blink"><rect x="115" y="82" width="13" height="10" fill="#608a5e"/><rect x="138" y="82" width="13" height="10" fill="#608a5e"/></g>
<rect x="122" y="99" width="20" height="5" fill="#2f4739"/>
<path d="M121 103h6v9h-6zM138 103h6v9h-6z" fill="#e5d6a5"/>
<!-- rough hood -->
<path d="M111 57h45v13h-46zM119 49h30v10h-30z" fill="#3c4941"/>

<g class="blade">
<!-- crooked dagger -->
<path d="M177 84h12v48h-12z" fill="#2d3437"/>
<path d="M178 79l11-24 5 12-6 38h-10z" fill="#c4d2cf"/>
<rect x="169" y="128" width="30" height="8" fill="#bd9456"/>
<rect x="181" y="135" width="7" height="27" fill="#654934"/>
</g>
<g class="buckler">
<!-- battered buckler -->
<rect x="65" y="125" width="36" height="37" fill="#263136"/>
<rect x="70" y="129" width="28" height="27" fill="#8d664b"/>
<rect x="81" y="130" width="7" height="24" fill="#c5a879"/>
<rect x="73" y="141" width="23" height="6" fill="#c5a879"/>
</g>
</g>
</svg>
