<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="move" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Orc Songweaver Bard — original Gridborn stage performer — move state study</title>
<desc id="description">Female Orc traveling songweaver with olive gray tusked face, asymmetric braided hair, gold circlet, burnt-orange embroidered stage coat, sheathed side sword and historically inspired large pear-bellied lute. Fretting hand grips the tied-fret neck, separate plucking hand passes over gut strings and a spell wave travels outward from the instrument soundboard. Original noncommercial source-art animation study.</desc>
<style>
.orc-bard-core{animation:orc-bard-walk 1.2s steps(1,end) infinite}.orc-bard-left-leg{transform-origin:113px 169px;animation:orc-bard-left-step 1.2s steps(1,end) infinite}.orc-bard-right-leg{transform-origin:149px 169px;animation:orc-bard-right-step 1.2s steps(1,end) infinite}
@keyframes orc-bard-walk{0%,84%,100%{transform:translate(0,0)}29%{transform:translate(-4px,-2px)}59%{transform:translate(4px,-1px)}}
@keyframes orc-bard-left-step{0%,84%,100%{transform:rotate(0)}29%{transform:rotate(-10deg)}59%{transform:rotate(12deg)}}
@keyframes orc-bard-right-step{0%,84%,100%{transform:rotate(0)}29%{transform:rotate(12deg)}59%{transform:rotate(-11deg)}}
@media(prefers-reduced-motion:reduce){.orc-bard-core,.orc-bard-pluck-hand,.orc-bard-left-leg,.orc-bard-right-leg,.orc-bard-strings,.orc-bard-chord,.orc-bard-lute,.orc-bard-pluck-arm{animation:none!important}}
</style>
