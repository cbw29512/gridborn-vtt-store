<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="move" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Elf Sparkweaver Sorcerer — original Gridborn innate magic study — move animation study</title>
<desc id="description">An original nonbinary elf Sparkweaver with long swept pale copper hair, pronounced elf ears, sleeveless indigo tunic with etched amber seam lines, slim field trousers, translucent crystal focus in the raised right palm, and a low-held plain staff in the left. Casting visibly gathers branching gold-blue energy in the palm then releases a separate bolt toward the target. Not commercially approved.</desc>
<style>
.spark-core{animation:spark-walk 1.2s steps(1,end) infinite}.spark-left-leg{transform-origin:113px 171px;animation:spark-left-step 1.2s steps(1,end) infinite}.spark-right-leg{transform-origin:147px 171px;animation:spark-right-step 1.2s steps(1,end) infinite}
@keyframes spark-walk{0%,84%,100%{transform:translate(0,0)}32%{transform:translate(-4px,-3px)}64%{transform:translate(4px,-1px)}}
@keyframes spark-left-step{0%,84%,100%{transform:rotate(0)}32%{transform:rotate(-13deg)}64%{transform:rotate(14deg)}}
@keyframes spark-right-step{0%,84%,100%{transform:rotate(0)}32%{transform:rotate(14deg)}64%{transform:rotate(-13deg)}}
@media(prefers-reduced-motion:reduce){.spark-core,.spark-focus,.spark-left-leg,.spark-right-leg,.spark-casting-arm,.spark-charge,.spark-bolt,.spark-staff{animation:none!important}}
</style>
