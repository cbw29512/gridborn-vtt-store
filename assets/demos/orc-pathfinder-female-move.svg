<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="move" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" shape-rendering="crispEdges" role="img" aria-labelledby="title description">
<title id="title">Female Orc Pathfinder Ranger — original Gridborn recurve archer — move Gridborn study</title>
<desc id="description">Original broad-shouldered female Orc wilderness pathfinder with ash-gray-green skin, two tusks, long asymmetric braided hair, fur-edged rust-ochre hood, practical dark leather vest, layered field skirt and boots, back quiver of separate arrows. Left bow hand firmly holds an outward recurve riser; the other hand draws bowstring to a consistent chin anchor and releases an independently flying fletched arrow. Prototype only.</desc>
