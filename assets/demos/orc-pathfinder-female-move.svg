.pathfinder-body{animation:pathfinder-stalk 1.2s steps(1,end) infinite}.pathfinder-leg-left{transform-origin:112px 165px;animation:pathfinder-step-left 1.2s steps(1,end) infinite}.pathfinder-leg-right{transform-origin:148px 167px;animation:pathfinder-step-right 1.2s steps(1,end) infinite}
@keyframes pathfinder-stalk{0%,84%,100%{transform:translate(0,0)}28%{transform:translate(-4px,-3px)}60%{transform:translate(4px,-1px)}}
@keyframes pathfinder-step-left{0%,84%,100%{transform:rotate(0)}28%{transform:rotate(-13deg)}60%{transform:rotate(15deg)}}
@keyframes pathfinder-step-right{0%,84%,100%{transform:rotate(0)}28%{transform:rotate(13deg)}60%{transform:rotate(-14deg)}}
@media(prefers-reduced-motion:reduce){.pathfinder-body,.pathfinder-quiver,.pathfinder-leg-left,.pathfinder-leg-right,.pathfinder-bow-arm,.pathfinder-draw-arm-rest,.pathfinder-draw-arm-anchored,.pathfinder-string-rest,.pathfinder-string-anchored,.pathfinder-arrow{animation:none!important}}
</style>
