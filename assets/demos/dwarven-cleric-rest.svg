<title id="title">Dwarven Cleric — rest animation study</title>
<desc id="description">Stocky dwarf beard with mace, heavy shield and radiant holy symbol. rest animation prototype, preview only.</desc>
<style>
.rig-core{animation:dwarf-prayer 4s ease-in-out infinite}.rig-weapon{transform-origin:188px 151px;animation:dwarf-prayer-mace 4s ease-in-out infinite}.rig-offhand{transform-origin:77px 142px;animation:dwarf-prayer-shield 4s ease-in-out infinite}
@keyframes dwarf-prayer{0%,10%,90%,100%{transform:translateY(8px)}45%{transform:translateY(6px)}}
@keyframes dwarf-prayer-mace{0%,10%,90%,100%{transform:rotate(24deg)}45%{transform:rotate(27deg)}}
@keyframes dwarf-prayer-shield{0%,10%,90%,100%{transform:rotate(15deg)}45%{transform:rotate(13deg)}}
@media(prefers-reduced-motion:reduce){.rig-core,.rig-head,.rig-weapon,.rig-offhand,.rig-effect,.rig-leg-left,.rig-leg-right,.dwarf-legs{animation:none!important}}
</style>
<ellipse cx="128" cy="207" rx="65" ry="14" fill="#080f16" opacity=".39"/>
<ellipse cx="126" cy="198" rx="75" ry="23" fill="none" stroke="#d4af74" stroke-width="3" opacity=".73"/>
