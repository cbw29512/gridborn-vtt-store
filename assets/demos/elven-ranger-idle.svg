<title id="title">Elven Ranger — original Gridborn forest longbow scout — idle preview</title>
<desc id="description">Elven pointed-ear wilderness archer with dark hood, leather forest tunic, quiver, braced curved longbow, visible drawing hand, and separate fletched arrow. Original noncommercial concept.</desc>
