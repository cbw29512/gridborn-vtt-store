<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="idle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Human Wildspeaker Druid — original Gridborn grove spellcaster — idle movement study</title>
<desc id="description">Female Human Wildspeaker druid with practical moss-brown layered leather, distinct oak-leaf shoulder mantle, long dark braid, bone and acorn charms, live gnarled quarterstaff held by one hand, and free right hand forming a directed thornvine spell. Original noncommercial artwork.</desc>
<style>
.druid-core{animation:druid-watch 3.2s steps(1,end) infinite}.druid-mantle{animation:druid-leaf-breath 3.2s steps(1,end) infinite}.druid-staff{transform-origin:75px 126px;animation:druid-staff-balance 3.2s steps(1,end) infinite}
@keyframes druid-watch{0%,85%,100%{transform:translate(0,0)}27%{transform:translate(-2px,-2px)}56%{transform:translate(2px,0)}}
@keyframes druid-leaf-breath{0%,85%,100%{transform:translate(0,0)}27%{transform:translate(-2px,0)}56%{transform:translate(2px,1px)}}
@keyframes druid-staff-balance{0%,85%,100%{transform:rotate(0)}27%{transform:rotate(-2deg)}56%{transform:rotate(2deg)}}
@media(prefers-reduced-motion:reduce){.druid-core,.druid-mantle,.druid-staff,.druid-left-leg,.druid-right-leg,.druid-casting-arm,.druid-vine{animation:none!important}}
</style>
