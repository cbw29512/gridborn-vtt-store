<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="move" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Gnome Rogue — move original motion study</title>
<desc id="description">Small wide-goggled scout holding mechanical crossbow, move motion prototype only. Not a paid product.</desc>
<style>
.rig-core{animation:gnome-scurry 1.2s steps(1,end) infinite}.rig-leg-left{transform-origin:111px 160px;animation:gnome-left-boot 1.2s steps(1,end) infinite}.rig-leg-right{transform-origin:144px 161px;animation:gnome-right-boot 1.2s steps(1,end) infinite}.rig-weapon{transform-origin:178px 140px;animation:gnome-crossbow-bob 1.2s steps(1,end) infinite}
   @keyframes gnome-scurry{0%,10%,90%,100%{transform:translate(0,0)}30%{transform:translate(-10px,-3px)}65%{transform:translate(7px,-1px)}}
   @keyframes gnome-left-boot{0%,10%,90%,100%{transform:rotate(0)}30%{transform:rotate(-20deg)}65%{transform:rotate(14deg)}}
   @keyframes gnome-right-boot{0%,10%,90%,100%{transform:rotate(0)}30%{transform:rotate(18deg)}65%{transform:rotate(-15deg)}}
   @keyframes gnome-crossbow-bob{0%,10%,90%,100%{transform:rotate(0)}30%{transform:rotate(7deg)}65%{transform:rotate(-5deg)}}
@media(prefers-reduced-motion:reduce){.rig-core,.rig-body,.rig-tail,.rig-fin,.rig-head,.rig-weapon,.rig-offhand,.rig-effect,.rig-bolt,.rig-leg-left,.rig-leg-right,.paladin-legs{animation:none!important}}
</style>
