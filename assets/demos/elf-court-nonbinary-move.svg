<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="move" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Elf Court Performer Bard — original Gridborn archlute performer — move performance study</title>
<desc id="description">Original nonbinary Elf court musician with long silver hair, pronounced elegant pointed ears, pale warm skin, deep teal and blue fitted courtwear, silver circlet, slim sword sheathed behind left hip, and a slender long-necked archlute with a raised second pegbox. One hand presses frets and a second visibly plucks the instrument while a unique filigree note spell leaves the soundboard. Four noncommercial art states.</desc>
<style>
.court-core{animation:court-step 1.2s steps(1,end) infinite}.court-left-leg{transform-origin:116px 169px;animation:court-left-step 1.2s steps(1,end) infinite}.court-right-leg{transform-origin:147px 169px;animation:court-right-step 1.2s steps(1,end) infinite}
@keyframes court-step{0%,84%,100%{transform:translate(0,0)}27%{transform:translate(-3px,-2px)}56%{transform:translate(4px,-1px)}}
@keyframes court-left-step{0%,84%,100%{transform:rotate(0)}27%{transform:rotate(-11deg)}56%{transform:rotate(13deg)}}
@keyframes court-right-step{0%,84%,100%{transform:rotate(0)}27%{transform:rotate(12deg)}56%{transform:rotate(-11deg)}}
@media(prefers-reduced-motion:reduce){.court-core,.court-plucking-hand,.court-left-leg,.court-right-leg,.court-strings,.court-notation,.court-archlute{animation:none!important}}
</style>
