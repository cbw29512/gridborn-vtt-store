<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="idle" data-foundation-id="standard-human-npc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">City Guard — original Gridborn concept — idle motion study</title>
<desc id="description">A city guard wearing steel armor and a navy-blue cloak, holding a spear in the right hand and a large shield strapped to the left arm.</desc>
<style>#human-body{animation:human-role-idle 3.2s steps(1,end) infinite}#human-tool-arm{transform-origin:166px 125px;animation:human-tool-idle 3.2s steps(1,end) infinite}
@keyframes human-role-idle{0%,100%{transform:translateY(0)}35%{transform:translateY(-2px)}70%{transform:translateY(1px)}}
@keyframes human-tool-idle{0%,100%{transform:rotate(0)}40%{transform:rotate(-3deg)}65%{transform:rotate(2deg)}}
@media(prefers-reduced-motion:reduce){#human-body,#human-left-leg,#human-right-leg,#human-tool-arm,#human-offhand-arm,#human-impact{animation:none!important}#human-impact{opacity:0!important}}</style>
<ellipse cx="128" cy="200" rx="58" ry="13" fill="#060b16" opacity=".34"/>
<ellipse cx="128" cy="195" rx="70" ry="24" fill="none" stroke="#ddb268" stroke-width="3" opacity=".70"/>

<g id="human-body">
<!-- warm brown trousers and boots -->
<g id="human-left-leg"><rect x="101" y="157" width="23" height="36" fill="#292832"/><rect x="103" y="159" width="19" height="25" fill="#615044"/></g>
<g id="human-right-leg"><rect x="137" y="157" width="23" height="36" fill="#292832"/><rect x="139" y="159" width="19" height="25" fill="#615044"/></g>
<!-- Steel breastplate, articulated straps and blue guard cloak -->
<path d="M87 98L95 91 162 91 171 102 185 164 170 172 164 136 158 173 98 173 88 140 77 173 74 122Z" fill="#263e58" stroke="#1e3045" stroke-width="4"/>
<path d="M91 104L117 97 159 102 166 149 148 161 109 160 91 145Z" fill="#9eb1c2" stroke="#364858" stroke-width="5"/>
<path d="M99 107L114 102 121 123 113 145 96 141Z" fill="#dce2df"/>
<path d="M131 104L153 106 158 141 143 148 130 126Z" fill="#788c9b"/>
<path d="M121 98h10v54h-10z" fill="#d2c482"/>
<rect x="91" y="150" width="76" height="10" fill="#574e49"/><path d="M117 151h24v10h-24z" fill="#e2b960"/>
<path d="M92 161l17 21h42l14-21" fill="#394a5c" stroke="#2a3948" stroke-width="3"/>
<!-- Same Human face dimensions with an occupational nasal helm overlay -->
<rect x="106" y="57" width="48" height="53" fill="#312a30"/>
<rect x="110" y="67" width="40" height="40" fill="#e2ad84"/>
<rect x="115" y="84" width="6" height="4" fill="#392f29"/><rect x="139" y="84" width="6" height="4" fill="#392f29"/>
<path d="M124 96h18" stroke="#855a52" stroke-width="3"/>
<path d="M104 64L112 48 148 48 156 65 151 82 144 82 144 67 115 67 113 82 105 82Z" fill="#9eacb6" stroke="#314656" stroke-width="5"/>
<path d="M111 51L146 51" stroke="#f0eddc" stroke-width="3"/>
<path d="M126 64h9v29h-9z" fill="#adbbc3" stroke="#667a87" stroke-width="2"/>
<path d="M121 48L130 40 138 48Z" fill="#e2bb76"/>
<g id="human-tool-arm">
<!-- Spear and right glove are one group: no detached shaft -->
<path d="M180 42L174 68H186Z" fill="#d3e0e1" stroke="#546979" stroke-width="4"/>
<rect x="177" y="67" width="6" height="127" fill="#755338" stroke="#3f342e" stroke-width="2"/>
<path d="M176 85h9" stroke="#debd79" stroke-width="3"/>
<rect x="159" y="112" width="16" height="42" fill="#8395a1" stroke="#394b5a" stroke-width="3"/>
<rect x="170" y="127" width="20" height="15" rx="3" fill="#555f69" stroke="#d0c1a5" stroke-width="3"/>
</g>
<g id="human-offhand-arm">
<rect x="82" y="114" width="16" height="43" fill="#8597a5" stroke="#394c5d" stroke-width="3"/>
<!-- Shield is strapped to the LEFT forearm and spans below the elbow -->
<path d="M67 120L101 120 110 139 103 171 86 183 69 170 61 139Z" fill="#6a829c" stroke="#e7cf8e" stroke-width="6"/>
<path d="M67 131L101 131 105 140 99 164 86 174 73 164 67 140Z" fill="#263f60"/>
<path d="M85 124v50m-18-31h37" stroke="#e2c475" stroke-width="5"/>
<circle cx="86" cy="147" r="7" fill="#e5e8e1" stroke="#7894a7" stroke-width="3"/>
</g>
<g id="human-impact" opacity="0" stroke="#f1d99a" stroke-width="4">
<path d="M223 112l12-13m-3 22h15m-27-29l3-15"/>
</g>
</g>
</svg>
