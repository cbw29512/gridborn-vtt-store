<svg data-gridborn-mode="attack" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Dwarf Hexwarden Warlock — original Gridborn occult scholar — attack animation study</title>
<desc id="description">Original nonbinary dwarf with sturdy compact limbs, warm umber complexion, short ash-plum cropped hair, asymmetrical violet-black hooded leather coat and rune-stitched edges. Left hand anchors a plain dark staff away from the face while a right-hand held open grimoire produces an independent occult rune and directed eldritch bolt. No paid-rights clearance.</desc>
<style>
.hex-core{animation:hex-brace 1.4s steps(1,end) 1 both}.hex-book{transform-origin:186px 141px;animation:hex-tome-open 1.4s steps(1,end) 1 both}.hex-rune{animation:hex-rune-invoke 1.4s steps(1,end) 1 both}.hex-bolt{animation:hex-eldritch-release 1.4s linear 1 both}
@keyframes hex-brace{0%,100%{transform:translate(0,0)}24%{transform:translate(-2px,-1px)}52%{transform:translate(-1px,-2px)}74%{transform:translate(1px,0)}}
@keyframes hex-tome-open{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}51%{transform:rotate(4deg)}75%{transform:rotate(0)}}
@keyframes hex-rune-invoke{0%,22%,54%,100%{opacity:0}30%{opacity:.6}43%,49%{opacity:1}}
@keyframes hex-eldritch-release{0%,51%{opacity:0;transform:translate(0,0)}57%{opacity:1;transform:translate(0,0)}68%{opacity:1;transform:translate(2px,-2px)}78%,100%{opacity:0;transform:translate(2px,-2px)}}
@media(prefers-reduced-motion:reduce){.hex-core,.hex-book,.hex-left-leg,.hex-right-leg,.hex-rune,.hex-bolt,.hex-staff{animation:none!important}}
</style>
