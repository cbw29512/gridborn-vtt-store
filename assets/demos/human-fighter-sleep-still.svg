  <rect x="102" y="166" width="17" height="20" fill="#493c3a"/> <rect x="130" y="165" width="17" height="21" fill="#493c3a"/>
  <rect x="101" y="184" width="22" height="8" fill="#171a27"/> <rect x="128" y="184" width="23" height="8" fill="#171a27"/>
  <rect x="96" y="147" width="59" height="25" fill="#171a27"/> <rect x="102" y="148" width="48" height="18" fill="#253144"/>
  <rect x="119" y="151" width="11" height="19" fill="#d9ae67"/>
  <!-- A 3/4 top-down steel breastplate, with gold belt and vambraces. -->
  <rect x="91" y="92" width="69" height="61" fill="#171a27"/> <rect x="96" y="95" width="59" height="54" fill="#516d89"/>
  <rect x="102" y="100" width="47" height="42" fill="#253144"/> <rect x="109" y="104" width="33" height="33" fill="#516d89"/>
  <rect x="113" y="105" width="7" height="29" fill="#93adc2"/> <rect x="132" y="105" width="7" height="29" fill="#93adc2"/>
  <rect x="119" y="105" width="14" height="33" fill="#253144"/> <rect x="121" y="108" width="10" height="19" fill="#d9ae67"/>
  <rect x="100" y="142" width="54" height="9" fill="#d9ae67"/> <rect x="105" y="144" width="44" height="5" fill="#67412e"/>
  <rect x="106" y="146" width="9" height="6" fill="#f9d690"/>
  <!-- Left arm and shield. -->
  <rect x="83" y="99" width="19" height="53" fill="#171a27"/> <rect x="87" y="101" width="13" height="46" fill="#516d89"/>
  <rect x="75" y="115" width="38" height="47" fill="#171a27"/> <rect x="79" y="119" width="29" height="36" fill="#253144"/>
  <rect x="84" y="123" width="20" height="29" fill="#516d89"/> <rect x="91" y="125" width="6" height="24" fill="#d9ae67"/>
  <rect x="86" y="134" width="17" height="6" fill="#d9ae67"/> <rect x="88" y="128" width="13" height="18" fill="#93adc2"/>
  <rect x="93" y="131" width="5" height="13" fill="#d9ae67"/>
  <!-- Right armored arm, hand grips hilt. -->
  <rect x="152" y="98" width="18" height="48" fill="#171a27"/> <rect x="155" y="102" width="12" height="38" fill="#516d89"/>
  <rect x="157" y="138" width="15" height="16" fill="#171a27"/> <rect x="158" y="140" width="11" height="12" fill="#f0be8c"/>
  <!-- Helm and face. -->
  <rect x="104" y="58" width="49" height="48" fill="#171a27"/>
  <rect x="108" y="63" width="40" height="40" fill="#516d89"/> <rect x="111" y="65" width="33" height="32" fill="#ce9668"/>
  <rect x="116" y="73" width="25" height="21" fill="#f0be8c"/>
