  <rect x="123" y="89" width="9" height="5" fill="#67412e"/>
  <rect x="103" y="55" width="51" height="16" fill="#171a27"/> <rect x="107" y="56" width="43" height="12" fill="#516d89"/>
  <rect x="116" y="49" width="27" height="10" fill="#171a27"/> <rect x="121" y="47" width="17" height="15" fill="#d9ae67"/>
  <rect x="106" y="70" width="8" height="19" fill="#93adc2"/> <rect x="143" y="70" width="8" height="19" fill="#253144"/>
  <rect x="106" y="93" width="43" height="9" fill="#253144"/> <rect x="116" y="95" width="24" height="8" fill="#d9ae67"/>
  
<g class="sword">
  <path d="M172 150h9v-57h-9z" fill="#171a27"/>
  <path d="M174 96h5V42h-5z" fill="#d8e5ea"/>
