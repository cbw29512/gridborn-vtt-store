  <path d="M171 100h11v43h-11z" fill="#67412e"/>
  <path d="M170 141h13v8h-13z" fill="#d9ae67"/>
</g>
</g>
</g>
<g class="sleep-letters" fill="#ffe1a0" font-family="monospace" font-weight="bold" font-size="19">
  <text x="212" y="67">Z</text>
  <text x="228" y="46" font-size="13">z</text>
</g>
</svg>