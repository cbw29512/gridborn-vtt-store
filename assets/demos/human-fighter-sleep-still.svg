<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description">
<title id="title">Gridborn sleeping Fighter — static resting fallback</title>
<desc id="description">The Fighter sleeps across a padded bedroll, with closed eyes, a lowered sword and slow breathing. Continuously looping preview only.</desc>
<style>
  .sword{transform-origin:176px 145px;transform:rotate(60deg)}
  .sleep-letters{opacity:.8}
</style>
<ellipse cx="129" cy="194" rx="53" ry="13" fill="#080f1c" opacity=".32"/>
<ellipse cx="128" cy="192" rx="67" ry="22" fill="none" stroke="#e9b967" stroke-width="3" opacity=".72"/>

<rect x="42" y="91" width="175" height="89" rx="13" fill="#161e2a" stroke="#ad8251" stroke-width="3"/>
<rect x="48" y="97" width="164" height="77" rx="10" fill="#556174"/>
<path d="M49 119h162v48H49z" fill="#39465a"/>
<path d="M57 98h56v26H57z" fill="#aeb9c3"/>
<g class="sleep-pose" transform="rotate(67 128 138) translate(-3 8)">
<g class="body">
  
