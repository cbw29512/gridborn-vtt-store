<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="move" data-source-body="village-innkeeper" data-undead-role="zombie" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Zombie — original Gridborn undead study — move animation</title>
<desc id="description">A ragged human zombie: dead grey-green skin, blank eyes, exposed bruised forearms and torn civilian clothing, both clawed hands anatomically connected to the arm rig.</desc>
<style>#undead-body{animation:undead-zombie-walk 1.2s steps(1,end) infinite}#undead-left-leg{animation:undead-zombie-drag 1.2s steps(1,end) infinite;transform-origin:115px 159px}#undead-right-leg{animation:undead-zombie-catch 1.2s steps(1,end) infinite;transform-origin:149px 159px}
@keyframes undead-zombie-walk{0%,100%{transform:translate(0,0)}40%{transform:translate(-2px,2px)}75%{transform:translate(3px,-1px)}}
@keyframes undead-zombie-drag{0%,100%{transform:rotate(-12deg)}40%{transform:rotate(-5deg)}75%{transform:rotate(-18deg)}}
@keyframes undead-zombie-catch{0%,100%{transform:rotate(1deg)}40%{transform:rotate(12deg)}75%{transform:rotate(-8deg)}}
@media(prefers-reduced-motion:reduce){#undead-body,#undead-left-leg,#undead-right-leg,#undead-right-claw,#undead-left-claw,#undead-claw-trails{animation:none!important}#undead-claw-trails{opacity:0!important}}</style>
<ellipse cx="128" cy="200" rx="58" ry="13" fill="#060b16" opacity=".34"/>
<ellipse cx="128" cy="195" rx="70" ry="24" fill="none" stroke="#ddb268" stroke-width="3" opacity=".70"/>

