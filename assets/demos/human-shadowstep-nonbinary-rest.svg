<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="rest" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Human Shadowstep Rogue nonbinary pregen — rest animation study</title>
<desc id="description">Hooded nonbinary rogue with two copper daggers and shadow trail. rest animation prototype, preview only.</desc>
<style>
.rig-core{animation:shadow-crouch 4s steps(1,end) infinite}.rig-weapon{transform-origin:185px 140px;animation:shadow-sheathe 4s steps(1,end) infinite}.rig-effect{animation:shadow-darkness 4s steps(1,end) infinite}
@keyframes shadow-crouch{0%,10%,90%,100%{transform:translateY(12px) rotate(-5deg)}45%{transform:translateY(11px) rotate(-5deg)}}
@keyframes shadow-sheathe{0%,10%,90%,100%{transform:rotate(48deg)}45%{transform:rotate(46deg)}}
@keyframes shadow-darkness{0%,10%,90%,100%{opacity:.16}45%{opacity:.38}}
@media(prefers-reduced-motion:reduce){.rig-core,.rig-head,.rig-weapon,.rig-offhand,.rig-effect,.rig-leg-left,.rig-leg-right,.dwarf-legs{animation:none!important}}
</style>
