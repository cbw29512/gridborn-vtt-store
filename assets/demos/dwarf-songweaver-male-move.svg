<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="move" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Dwarf Songweaver Bard — original Gridborn stonehall troubadour — move source animation study</title>
<desc id="description">Male Dwarf Songweaver in heavy copper-navy performance jerkin, ash-brown square braided beard, gold circlet, side-sheathed sword and physically plucked short-neck eight-course lute. The left fretting hand secures the neck while the right strumming hand arcs over rosette and visible string rows. A separate original amber harmonic rune ring travels toward target. Original noncommercial study.</desc>
<style>
.dwarf-bard-core{animation:dwarf-bard-march 1.2s steps(1,end) infinite}.dwarf-bard-left-leg{transform-origin:111px 172px;animation:dwarf-bard-left-step 1.2s steps(1,end) infinite}.dwarf-bard-right-leg{transform-origin:148px 172px;animation:dwarf-bard-right-step 1.2s steps(1,end) infinite}
@keyframes dwarf-bard-march{0%,84%,100%{transform:translate(0,0)}27%{transform:translate(-4px,-2px)}58%{transform:translate(4px,-1px)}}
@keyframes dwarf-bard-left-step{0%,84%,100%{transform:rotate(0)}27%{transform:rotate(-10deg)}58%{transform:rotate(12deg)}}
@keyframes dwarf-bard-right-step{0%,84%,100%{transform:rotate(0)}27%{transform:rotate(12deg)}58%{transform:rotate(-10deg)}}
