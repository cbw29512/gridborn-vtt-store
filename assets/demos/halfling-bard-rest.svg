<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="rest" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Halfling Bard — original Gridborn lute performer — rest motion study</title>
<desc id="description">Small halfling performer with curly chestnut hair, wine-red tailored coat, gold embroidered trim, deep green waistcoat and historically inspired pear-bodied lute with bent pegbox, frets and rosette. The two hands visibly fret and pluck. Original prototype art; not for purchase.</desc>
<style>
.bard-core{animation:bard-seated-rest 4s steps(1,end) infinite}.bard-lute{transform-origin:147px 151px;animation:bard-lute-down 4s steps(1,end) infinite}.bard-pluck-hand{animation:bard-rest-hand 4s steps(1,end) infinite}
@keyframes bard-seated-rest{0%,85%,100%{transform:translateY(8px)}43%{transform:translateY(10px)}}
@keyframes bard-lute-down{0%,85%,100%{transform:rotate(11deg) translateY(5px)}43%{transform:rotate(13deg) translateY(5px)}}
@keyframes bard-rest-hand{0%,85%,100%{transform:translateY(6px)}43%{transform:translateY(7px)}}
@media(prefers-reduced-motion:reduce){.bard-core,.bard-pluck-hand,.bard-left-leg,.bard-right-leg,.bard-lute,.bard-strings,.bard-spell{animation:none!important}}
</style>
