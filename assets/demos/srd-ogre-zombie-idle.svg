<?xml version="1.0" encoding="UTF-8"?>
<svg data-undead-family="ogre" data-source-body="cave-ogre" data-gridborn-mode="idle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Ogre Zombie — idle animation study</title>
<desc id="description">Enormous hunched ogre with slab club and heavy, uneven steps. idle animation prototype, preview only.</desc>
<style>
.rig-core{animation:ogre-heavy-breath 3.2s ease-in-out infinite}.rig-weapon{transform-origin:208px 172px;animation:ogre-club-weight 3.2s ease-in-out infinite}
@keyframes ogre-heavy-breath{0%,10%,90%,100%{transform:translate(0,0)}42%{transform:translate(0,-2px) rotate(-2deg)}70%{transform:translateY(1px)}}
@keyframes ogre-club-weight{0%,10%,90%,100%{transform:rotate(0)}42%{transform:rotate(-8deg)}70%{transform:rotate(5deg)}}
@media(prefers-reduced-motion:reduce){.rig-core,.rig-head,.rig-weapon,.rig-offhand,.rig-effect,.rig-leg-left,.rig-leg-right,.dwarf-legs{animation:none!important}}
.rig-core{animation:ogre-zombie-sway 3.2s steps(1,end) infinite}.rig-weapon{animation:ogre-zombie-hold 3.2s steps(1,end) infinite;transform-origin:208px 172px}
@keyframes ogre-zombie-sway{0%,100%{transform:translate(0,0) rotate(-2deg)}38%{transform:translate(2px,1px) rotate(2deg)}76%{transform:translate(-1px,1px) rotate(-3deg)}}
@keyframes ogre-zombie-hold{0%,100%{transform:rotate(8deg)}38%{transform:rotate(-3deg)}76%{transform:rotate(5deg)}}
</style>
