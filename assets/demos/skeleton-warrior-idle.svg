<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="idle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240"
 role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Skeleton Warrior — idle original motion study</title>
<desc id="description">Undead remains upright and shifts skull, guard and sword jerkily, without breathing. Preview only; not a certified VTT product.</desc>
<style>
.bone-skull{transform-origin:129px 105px;animation:bone-idle-skull 3s steps(1,end) infinite}
.bone-arm-left,.bone-shield{transform-origin:100px 110px;animation:bone-idle-guard 3s steps(1,end) infinite}
.bone-arm-right,.bone-blade{transform-origin:157px 110px;animation:bone-idle-sword 3s steps(1,end) infinite}
.bone-cape{animation:bone-idle-cloth 3s steps(1,end) infinite}
@keyframes bone-idle-skull{0%,12%,88%,100%{transform:rotate(0)}32%{transform:rotate(-3deg)}65%{transform:rotate(2deg)}}
@keyframes bone-idle-guard{0%,12%,88%,100%{transform:rotate(0)}32%{transform:rotate(3deg)}65%{transform:rotate(-2deg)}}
@keyframes bone-idle-sword{0%,12%,88%,100%{transform:rotate(0)}32%{transform:rotate(-4deg)}65%{transform:rotate(3deg)}}
@keyframes bone-idle-cloth{0%,12%,88%,100%{transform:translateX(0)}32%{transform:translateX(2px)}65%{transform:translateX(-2px)}}
@media(prefers-reduced-motion:reduce){.bone-assembly,.bone-skull,.bone-cape,.bone-leg-left,.bone-leg-right,.bone-arm-left,.bone-arm-right,.bone-shield,.bone-blade{animation:none!important}}
</style>
<!-- Neutral battle-map ring. No imported visual references. -->
<ellipse cx="127" cy="204" rx="61" ry="12" fill="#050911" opacity=".48"/>
<ellipse cx="128" cy="194" rx="74" ry="23" fill="none" stroke="#bf9d6a" stroke-width="3" opacity=".70"/>
<g class="bone-assembly">
<g class="bone-cape">
 <path d="M100 91H158L185 166 164 184 149 171 137 187 110 177 92 188 74 166Z" fill="#242534" stroke="#101722" stroke-width="5"/>
 <path d="M102 96H157L174 164 160 175 146 160 136 179 110 168 92 178 82 163Z" fill="#56465b"/>
 <path d="M102 112L87 165 97 167 109 116Z" fill="#857085" opacity=".48"/>
 <path d="M153 110L169 166 158 163 146 115Z" fill="#322d41"/>
</g>
<!-- Separate left and right bone legs, open negative space at the knees. -->
<g class="bone-leg-left">
 <path d="M106 152L116 153 112 178 102 177Z" fill="#e1d8bd"/>
 <path d="M107 155L111 156 107 172 104 171Z" fill="#f7eccb"/>
