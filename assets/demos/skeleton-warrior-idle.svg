 <path d="M186 69L191 56 196 73Z" fill="#e7e6d8"/>
 <rect x="175" y="137" width="30" height="8" fill="#363b3d"/>
 <rect x="178" y="139" width="24" height="3" fill="#c3a271"/>
 <path d="M188 145H194V170H188Z" fill="#886643"/>
 <rect x="186" y="169" width="11" height="6" fill="#bf9c68"/>
</g>
<g class="bone-shield">
 <path d="M62 124H103V158L83 186 62 159Z" fill="#18222e" stroke="#111b24" stroke-width="3"/>
 <path d="M68 130H97V156L83 177 68 154Z" fill="#855760"/>
 <path d="M72 133H80V160L83 168 73 151Z" fill="#b47f7d"/>
