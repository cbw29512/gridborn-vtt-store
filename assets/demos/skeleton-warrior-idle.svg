 <path d="M96 198H111L121 205V210H91V204Z" fill="#5f5658" stroke="#1c2530" stroke-width="3"/>
</g>
<g class="bone-leg-right">
 <path d="M141 152L151 152 156 178 146 180Z" fill="#e2d9c0"/>
 <path d="M144 155L148 155 152 173 148 175Z" fill="#fff0cf"/>
 <circle cx="152" cy="181" r="7" fill="#c7ba9f" stroke="#202932" stroke-width="3"/>
 <path d="M148 186H158L161 200H152Z" fill="#ddd1b4"/>
 <path d="M151 198H167L177 206V211H147V204Z" fill="#625a59" stroke="#1c2530" stroke-width="3"/>
</g>
<g class="bone-pelvis">
 <path d="M104 145H154L157 154 143 165H115L101 153Z" fill="#d7ceb1" stroke="#25303a" stroke-width="3"/>
 <path d="M109 150H123V158H113Z M136 150H151L145 158H136Z" fill="#34363b"/>
 <path d="M123 145H136V164L128 168 122 162Z" fill="#9b937f"/>
</g>
<!-- Dark gaps between rib arcs are intentional: this is an open skeleton. -->
<g class="bone-ribcage">
 <path d="M103 108H153L158 145 141 154 116 154 98 143Z" fill="#1d2530" stroke="#101821" stroke-width="5"/>
 <path d="M127 111H134L134 155H126Z" fill="#e6dec4"/>
