 <path d="M128 117Q116 113 109 120M132 117Q144 113 151 120" fill="none" stroke="#e4dbc1" stroke-width="5" stroke-linecap="square"/>
<path d="M128 125Q115 121 112 128M132 125Q145 121 148 128" fill="none" stroke="#e4dbc1" stroke-width="5" stroke-linecap="square"/>
<path d="M128 133Q114 129 115 136M132 133Q146 129 145 136" fill="none" stroke="#cec3a9" stroke-width="5" stroke-linecap="square"/>
<path d="M128 141Q113 137 118 144M132 141Q147 137 142 144" fill="none" stroke="#cec3a9" stroke-width="4" stroke-linecap="square"/>
 <path d="M104 142L112 150 119 151M152 142L145 150 138 151" fill="none" stroke="#c5b99f" stroke-width="4"/>
 <path d="M106 115L105 135M152 115L153 135" fill="none" stroke="#8a7770" stroke-width="3"/>
</g>
<!-- Segmented skeletal arms: visible shoulders, elbows, wrists. -->
<g class="bone-arm-left">
 <circle cx="100" cy="109" r="9" fill="#d5ccb3" stroke="#26303a" stroke-width="3"/>
