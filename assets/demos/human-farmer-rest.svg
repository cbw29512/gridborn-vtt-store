<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="rest" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Human Farmer · Female — original Gridborn study — rest motion study</title>
<desc id="description">Original human farmer with straw hat, denim overalls, braid and a physically held three-tined pitchfork; inherits core human anatomy from the Innkeeper body rig.</desc>
<style>
#farm-body{animation:farm-rest-body 4s steps(1,end) infinite}#farm-tool-arm{transform-origin:162px 128px;animation:farm-rest-pitchfork 4s steps(1,end) infinite}
@keyframes farm-rest-body{0%,100%{transform:translate(0,3px)}55%{transform:translate(0,5px)}}
@keyframes farm-rest-pitchfork{0%,100%{transform:rotate(13deg)}55%{transform:rotate(16deg)}}
@media(prefers-reduced-motion:reduce){#farm-body,#farm-left-leg,#farm-right-leg,#farm-tool-arm,#farm-dirt{animation:none!important}#farm-dirt{opacity:0!important}}
</style>
<ellipse cx="128" cy="200" rx="58" ry="13" fill="#060b16" opacity=".34"/>
<ellipse cx="128" cy="195" rx="70" ry="24" fill="none" stroke="#ddb268" stroke-width="3" opacity=".70"/>

<g id="farm-body">
<!-- warm brown trousers and boots -->
<g id="farm-left-leg"><rect x="101" y="157" width="23" height="36" fill="#292832"/><rect x="103" y="159" width="19" height="25" fill="#615044"/></g>
<g id="farm-right-leg"><rect x="137" y="157" width="23" height="36" fill="#292832"/><rect x="139" y="159" width="19" height="25" fill="#615044"/></g>
<!-- Original human anatomy; farmer clothing and denim bib are role overlays. -->
<path d="M92 98h69v12h14v39h-18v25H93v-26H78v-37h14z" fill="#3b3431"/>
<path d="M95 101h62v54H95z" fill="#e8d19e"/>
<path d="M103 116h47v59h-47z" fill="#557785"/>
<path d="M106 111h11v45h-11zM141 111h10v45h-10z" fill="#345365"/>
<path d="M118 133h20v23h-20z" fill="#8299a0" stroke="#365769" stroke-width="3"/>
<path d="M119 134v8h17v-8" fill="none" stroke="#c4c6a7" stroke-width="2"/>
<rect x="83" y="113" width="15" height="39" fill="#e8d19e"/>
<path d="M95 144h61" fill="none" stroke="#bc9161" stroke-width="7"/>
<rect x="127" y="108" width="7" height="16" fill="#c6a171"/>
<!-- Same underlying human head geometry: long braid and straw field hat. -->
<rect x="106" y="57" width="48" height="53" fill="#35272b"/>
<rect x="110" y="67" width="40" height="40" fill="#e2ad84"/>
<path d="M105 72V58h12v-8h25v7h13v19h-9v-9h-30v7z" fill="#593a31"/>
<path d="M145 74h12v30l-7 10-8-8z" fill="#6d4633"/>
<path d="M148 87h10m-10 10h10" stroke="#c18e5a" stroke-width="3"/>
<rect x="115" y="84" width="6" height="4" fill="#41332a"/><rect x="139" y="84" width="6" height="4" fill="#41332a"/>
<path d="M124 95h16" stroke="#a45f57" stroke-width="3"/>
<path d="M106 54h49v-17h-49z" fill="#caa15f"/>
<rect x="94" y="54" width="74" height="9" fill="#e4bc78"/>
<rect x="109" y="51" width="43" height="5" fill="#836041"/>
<path d="M115 45h27" stroke="#f4dc9d" stroke-width="3"/>
<g id="farm-tool-arm">
<!-- A real three-tined pitchfork, held with the human wrist rather than floating. -->
<rect x="177" y="67" width="6" height="123" fill="#8b5e37" stroke="#48372e" stroke-width="2"/>
<path d="M180 68V45M169 45V71Q169 83 180 84Q191 83 191 71V45" fill="none" stroke="#b9c4c8" stroke-width="5" stroke-linecap="square"/>
<path d="M169 61h22" fill="none" stroke="#dbe1d5" stroke-width="3"/>
<rect x="159" y="113" width="14" height="38" fill="#e8d19e"/>
<rect x="169" y="128" width="16" height="13" rx="3" fill="#e2ad84" stroke="#bd8668" stroke-width="2"/>
</g>
<path d="M96 144h14v15H96z" fill="#e2ad84"/>
<path d="M104 170h16v10h-16" fill="none" stroke="#c6a171" stroke-width="3"/>
<g id="farm-hay" fill="#d2b36b"><path d="M94 168l-11-22 15 10z"/><path d="M92 161l-11-14" stroke="#cfb071" stroke-width="3"/></g>
<g id="farm-dirt" opacity="0" fill="#9b7b58"><path d="M202 170l15-7-6 15z"/><circle cx="219" cy="164" r="4"/><circle cx="224" cy="180" r="3"/></g>

</g>
</svg>
