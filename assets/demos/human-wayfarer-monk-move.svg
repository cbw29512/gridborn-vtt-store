<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="move" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Human Wayfarer Monk — original Gridborn unarmed martial artist — move motion study</title>
<desc id="description">A human male wayfarer martial artist in plain deep-indigo and ocher travel wraps, braided waist sash, practical foot bindings, exposed forearms with padded handwraps, balanced fighting guard and a distinct anatomical palm strike followed by a chambered front kick. No armor or held weapon. Original preview study, not sellable.</desc>
<style>
.monk-core{animation:monk-footwork 1.2s steps(1,end) infinite}.monk-left-leg{transform-origin:116px 167px;animation:monk-left-step 1.2s steps(1,end) infinite}.monk-right-leg{transform-origin:145px 167px;animation:monk-right-step 1.2s steps(1,end) infinite}
@keyframes monk-footwork{0%,84%,100%{transform:translate(0,0)}25%{transform:translate(-4px,-3px)}59%{transform:translate(5px,-1px)}}
@keyframes monk-left-step{0%,84%,100%{transform:rotate(0)}25%{transform:rotate(-17deg)}59%{transform:rotate(13deg)}}
@keyframes monk-right-step{0%,84%,100%{transform:rotate(0)}25%{transform:rotate(15deg)}59%{transform:rotate(-15deg)}}
@media(prefers-reduced-motion:reduce){.monk-core,.monk-left-guard,.monk-right-guard,.monk-left-leg,.monk-right-leg,.monk-palm-strike,.monk-kick-leg,.monk-strike-trail{animation:none!important}}
</style>
