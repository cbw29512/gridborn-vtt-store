<title id="title">Human Paladin — attack original motion study</title>
<desc id="description">Ivory tabard with crested helm, shield and sword, attack motion prototype only. Not a paid product.</desc>
<style>
.rig-core{animation:paladin-smite-step 1.4s steps(1,end) 1 both}.rig-weapon{transform-origin:193px 148px;animation:paladin-sunstrike 1.4s steps(1,end) 1 both}.rig-offhand{transform-origin:76px 151px;animation:paladin-shield-block 1.4s steps(1,end) 1 both}
   @keyframes paladin-smite-step{0%,100%{transform:translate(0,0)}24%{transform:translate(4px,0)}53%{transform:translate(-9px,-2px)}76%{transform:translate(-2px,0)}}
   @keyframes paladin-sunstrike{0%,100%{transform:rotate(0)}24%{transform:rotate(-43deg)}53%{transform:rotate(59deg)}76%{transform:rotate(12deg)}}
   @keyframes paladin-shield-block{0%,100%{transform:rotate(0)}24%{transform:rotate(-8deg)}53%{transform:rotate(14deg)}76%{transform:rotate(5deg)}}
@media(prefers-reduced-motion:reduce){.rig-core,.rig-body,.rig-tail,.rig-fin,.rig-head,.rig-weapon,.rig-offhand,.rig-effect,.rig-leg-left,.rig-leg-right,.paladin-legs{animation:none!important}}
</style>
