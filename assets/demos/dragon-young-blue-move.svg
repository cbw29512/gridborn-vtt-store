<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges" data-gridborn-mode="move" data-foundation-id="western-four-legged-winged-dragon" data-dragon-species="Blue" data-dragon-age="young">
<title id="title">Young Blue Dragon — original Gridborn move art study</title>
<desc id="description">Original side-profile six-limbed fantasy dragon, four articulated legs, two membranous wings, tail, horns, readable eye and species-specific lightning breath. Research and release approval pending.</desc>
<style>#dragon-core{animation:dragon-walk 1.2s steps(1,end) infinite}#dragon-front-near{transform-origin:157px 154px;animation:dragon-front-stride 1.2s steps(1,end) infinite}#dragon-hind-near{transform-origin:100px 149px;animation:dragon-hind-stride 1.2s steps(1,end) infinite}#dragon-front-far{transform-origin:171px 152px;animation:dragon-hind-stride 1.2s steps(1,end) infinite}#dragon-hind-far{transform-origin:121px 155px;animation:dragon-front-stride 1.2s steps(1,end) infinite}#dragon-tail{transform-origin:91px 151px;animation:dragon-march-tail 1.2s steps(1,end) infinite}
@keyframes dragon-walk{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-2px)}60%{transform:translate(-2px,0)}}
@keyframes dragon-front-stride{0%,100%{transform:rotate(0)}25%{transform:rotate(16deg)}60%{transform:rotate(-13deg)}}
@keyframes dragon-hind-stride{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg)}60%{transform:rotate(15deg)}}
@keyframes dragon-march-tail{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}60%{transform:rotate(5deg)}}
@media(prefers-reduced-motion:reduce){#dragon-core,#dragon-tail,#dragon-wing-near,#dragon-head,#dragon-mouth,#dragon-breath,#dragon-front-near,#dragon-hind-near,#dragon-front-far,#dragon-hind-far{animation:none!important}#dragon-breath{opacity:0!important}}</style>
