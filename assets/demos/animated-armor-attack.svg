<?xml version="1.0" encoding="UTF-8"?>
<svg data-gridborn-mode="attack" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Animated Armor — attack original motion study</title>
<desc id="description">Empty visor, articulated metal plates and heavy blade with attack animation. Noncommercial prototype.</desc>
<style>
.rig-core{animation:armor-lunge 1.4s steps(1,end) 1 both}.rig-weapon{animation:armor-cleave 1.4s steps(1,end) 1 both;transform-origin:195px 150px}
 @keyframes armor-lunge{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,0)}53%{transform:translate(7px,-3px)}77%{transform:translate(2px,0)}}
 @keyframes armor-cleave{0%,100%{transform:rotate(-8deg)}25%{transform:rotate(-20deg)}53%{transform:rotate(6deg)}77%{transform:rotate(2deg)}}
@media(prefers-reduced-motion:reduce){.rig-core,.rig-weapon,.rig-head,.rig-boot-l,.rig-boot-r,.rig-foot-left,.rig-foot-right,.rig-visorglow,.rig-glow{animation:none!important}}
</style>
