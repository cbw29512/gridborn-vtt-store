<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Dwarf Pathfinder Ranger — original Gridborn bow scout</title>
<desc id="description">Original male Dwarf Pathfinder ranger, compact wide shoulders, weathered warm brown face, thick two-fork ash-grey beard, moss field hood, weathered copper leather and heavy trekking boots, a rune-carved quiver and large curved yew field bow. Bow arm remains extended at the grip; draw arm anchors under the cheek then independently nocks, releases and follows through with a fletched arrow. Noncommercial study.</desc>
