<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" shape-rendering="crispEdges" role="img" aria-labelledby="title description">
<title id="title">Nonbinary Goblin Pathfinder — original Gridborn shortbow scout</title>
<desc id="description">Original nonbinary Goblin Ranger, crouched small green forest scout with large asymmetrical ears, broad amber eyes, messy crest hair, chest-strapped narrow fletched quiver, moss and copper patched field vest, narrow trousers, bandaged bare-foot travel boots. One extended arm grips a compact recurved shortbow; the other hand anchors below the cheek, drawing string and arrow before independently releasing the projectile. Noncommercial art study.</desc>
