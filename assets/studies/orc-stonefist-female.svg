<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
<title id="title">Orc Stonefist Monk — original Gridborn unarmed fighter</title>
<desc id="description">An original female Orc Stonefist monk with broad athletic build, olive-gray skin, small exposed lower tusks, braided side-shaved dark hair, square stone-inspired belt buckle, sienna shoulder wraps, reinforced cloth gauntlets and bare strapped fighting boots. Her unarmed two-footed hammerfist strike rotates a complete raised arm and creates a small ground-level dust impact. No armor or weapons; prototype not for sale.</desc>
